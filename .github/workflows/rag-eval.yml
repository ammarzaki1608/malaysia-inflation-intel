name: Evaluate chatbot answers

# Scores the live /ask endpoint against evaluation/test_questions.py.
#
# It runs only on demand: Actions -> "Evaluate chatbot answers" -> Run workflow
# (from main; sign-in to Google Cloud is only accepted from main).
#
# It used to run after every deploy that changed the API. Each run makes about
# 60 to 100 Gemini requests on the same key as the live chatbot, so a day with
# several merges used up the daily quota and took the chatbot down for real
# users. Run it when a batch of changes is finished, not after each merge.
on:
  workflow_dispatch:

# Only the newest deployed version is worth grading.
concurrency:
  group: rag-eval
  cancel-in-progress: true

# id-token lets a job ask GitHub for the short-lived token that Google exchanges
# for credentials. No key is stored in this repository's secrets.
permissions:
  contents: read
  id-token: write

env:
  REGION: asia-southeast1
  # Keyless sign-in (Workload Identity Federation, infra/terraform/iam.tf).
  # These are identifiers, not secrets.
  WORKLOAD_IDENTITY_PROVIDER: projects/359684638464/locations/global/workloadIdentityPools/github/providers/github-actions
  DEPLOYER_SERVICE_ACCOUNT: github-deployer@modular-rush-495414-i2.iam.gserviceaccount.com

jobs:
  rag-eval:
    name: Evaluate chatbot answers
    runs-on: ubuntu-latest
    timeout-minutes: 35   # healthy run is a few minutes (one judge call per question); the script gives up at 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # optional: marks these calls as evaluation traffic so the API logs them
      # (timings, tokens, retrieved entries). Without it the run still works.
      EVAL_LOG_TOKEN: ${{ secrets.EVAL_LOG_TOKEN }}
      # optional: a stronger model than the one answering, to avoid self-grading
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'gemini-3.1-flash-lite' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the Gemini key is set
        id: guard
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY secret not set — skipping RAG evaluation"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GCP
        if: steps.guard.outputs.run == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Get deployed API URL
        if: steps.guard.outputs.run == 'true'
        run: |
          URL=$(gcloud run services describe inflation-api --region ${{ env.REGION }} --format 'value(status.url)')
          echo "API_URL=$URL" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Run evaluation against the deployed API
        if: steps.guard.outputs.run == 'true'
        working-directory: evaluation
        run: |
          pip install -r requirements.txt
          curl -sf "$API_URL/health" > /dev/null   # wake the service before timing-sensitive calls
          python run_eval.py

      # Scores, the judge's reasons and every answer, for reading after the run.
      # The same summary table is shown on the run's Summary page.
      - name: Upload evaluation results
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rag-eval-results
          path: evaluation/results/
          if-no-files-found: ignore
