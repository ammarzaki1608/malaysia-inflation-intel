name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'ml/serving/**'
      - 'app/streamlit/**'
  workflow_dispatch:

env:
  PROJECT_ID: modular-rush-495414-i2
  REGION: asia-southeast1
  REGISTRY: asia-southeast1-docker.pkg.dev

jobs:
  deploy-api:
    name: Deploy FastAPI service
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.get-url.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push API image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/malaysia-inflation-intel/inflation-api:latest \
            ml/serving/
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/malaysia-inflation-intel/inflation-api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy inflation-api \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/malaysia-inflation-intel/inflation-api:latest \
            --region ${{ env.REGION }} \
            --platform managed \
            --quiet

      - name: Get deployed API URL
        id: get-url
        run: |
          URL=$(gcloud run services describe inflation-api --region ${{ env.REGION }} --format 'value(status.url)')
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"

  deploy-streamlit:
    name: Deploy Streamlit app
    runs-on: ubuntu-latest
    needs: deploy-api

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push Streamlit image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/malaysia-inflation-intel/inflation-app:latest \
            app/streamlit/
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/malaysia-inflation-intel/inflation-app:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy inflation-app \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/malaysia-inflation-intel/inflation-app:latest \
            --region ${{ env.REGION }} \
            --platform managed \
            --set-env-vars API_URL=${{ needs.deploy-api.outputs.api_url }} \
            --quiet
  rag-eval:
    name: Evaluate chatbot answers (post-deploy check)
    runs-on: ubuntu-latest
    needs: deploy-api
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      API_URL: ${{ needs.deploy-api.outputs.api_url }}
      # optional: a stronger model than the one answering, to avoid self-grading
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'gemini-3.1-flash-lite' }}

    steps:
      - uses: actions/checkout@v4

      - name: Skip if no Gemini key is configured
        id: guard
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY secret not set — skipping RAG evaluation"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Run evaluation against the deployed API
        if: steps.guard.outputs.run == 'true'
        working-directory: evaluation
        run: |
          pip install -r requirements.txt
          curl -sf "$API_URL/health" > /dev/null   # wake the service before timing-sensitive calls
          python run_eval.py
