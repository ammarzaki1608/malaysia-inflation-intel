name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'ml/serving/**'
      - 'app/streamlit/**'
  workflow_dispatch:

# Merging several PRs in a row starts several runs; let them finish one at a
# time (newest last) instead of racing to update the same Cloud Run resource.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

# id-token lets a job ask GitHub for the short-lived token that Google exchanges
# for credentials. No key is stored in this repository's secrets.
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: modular-rush-495414-i2
  REGION: asia-southeast1
  REGISTRY: asia-southeast1-docker.pkg.dev
  # Keyless sign-in (Workload Identity Federation, infra/terraform/iam.tf).
  # These are identifiers, not secrets.
  WORKLOAD_IDENTITY_PROVIDER: projects/359684638464/locations/global/workloadIdentityPools/github/providers/github-actions
  DEPLOYER_SERVICE_ACCOUNT: github-deployer@modular-rush-495414-i2.iam.gserviceaccount.com

jobs:
  deploy-api:
    name: Deploy FastAPI service
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.get-url.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push API image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/malaysia-inflation-intel/inflation-api:latest \
            ml/serving/
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/malaysia-inflation-intel/inflation-api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy inflation-api \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/malaysia-inflation-intel/inflation-api:latest \
            --region ${{ env.REGION }} \
            --platform managed \
            --quiet

      - name: Get deployed API URL
        id: get-url
        run: |
          URL=$(gcloud run services describe inflation-api --region ${{ env.REGION }} --format 'value(status.url)')
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"

  deploy-streamlit:
    name: Deploy Streamlit app
    runs-on: ubuntu-latest
    needs: deploy-api

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push Streamlit image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/malaysia-inflation-intel/inflation-app:latest \
            app/streamlit/
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/malaysia-inflation-intel/inflation-app:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy inflation-app \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/malaysia-inflation-intel/inflation-app:latest \
            --region ${{ env.REGION }} \
            --platform managed \
            --set-env-vars API_URL=${{ needs.deploy-api.outputs.api_url }} \
            --quiet

# The chatbot evaluation is a separate workflow (rag-eval.yml) that is started
# by hand. It is not run after each deploy, to keep Gemini usage for real users.
