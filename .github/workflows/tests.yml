name: Tests and lint (PR check)

# Unit tests for the API and the forecasting code, plus a linter. Nothing here
# talks to GCP or Gemini: the API tests fake retrieval and the model, and the
# training tests run on synthetic data. Each job installs the same pinned
# requirements as the image that runs the code in production.
on:
  pull_request:
    paths:
      - 'ml/**'
      - 'tests/**'
      - 'evaluation/**'
      - 'app/streamlit/**'
      - 'ingestion/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.4
      - run: ruff check .

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/serving/requirements.txt
      - name: Install the API image's pinned requirements
        run: pip install -r ml/serving/requirements.txt pytest==9.2.0
      - name: Run API tests
        run: pytest tests/api -v

  training-tests:
    name: Forecasting tests (incl. leakage self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt
      - name: Install the pipeline image's pinned requirements
        run: pip install -r ingestion/requirements.txt pytest==9.2.0
      - name: Run forecasting tests
        run: pytest tests/training -v --durations=5
